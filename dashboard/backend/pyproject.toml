[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abjithbk", email = "bkabjith2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query()/etc. in default args is the required
# pattern, not a bug - this flag is a well-known false positive for FastAPI.
extend-ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/backend/tests"]
