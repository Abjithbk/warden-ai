[project]
name = "warden-detector-receiver"
version = "0.1.0"
description = "Receives Alertmanager webhooks and normalizes them into Warden incidents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
