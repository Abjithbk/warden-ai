apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: warden-burn-rate-alerts
  namespace: monitoring
  labels:
    release: prometheus
    app.kubernetes.io/part-of: warden
spec:
  groups:
    - name: warden.slo.burnrate
      rules:
        # SLO 99% => error budget 0.01
        # Fast burn: 14.4x budget rate (demo windows 5m + 1m; production would be 1h + 5m)
        - alert: WardenErrorBudgetBurnFast
          expr: |
            warden:sli_error_ratio:rate5m > (14.4 * 0.01)
            and
            warden:sli_error_ratio:rate1m > (14.4 * 0.01)
          for: 30s
          labels:
            severity: critical
            slo: availability
            burn: fast
          annotations:
            summary: "Fast error-budget burn on {{ $labels.service }}"
            description: "{{ $labels.service }} error ratio is {{ $value | humanizePercentage }} (SLO 99%, threshold 14.4x burn)."

        # Slow burn: 6x budget rate (demo windows 30m + 5m; production would be 6h + 30m)
        - alert: WardenErrorBudgetBurnSlow
          expr: |
            warden:sli_error_ratio:rate30m > (6 * 0.01)
            and
            warden:sli_error_ratio:rate5m > (6 * 0.01)
          for: 1m
          labels:
            severity: warning
            slo: availability
            burn: slow
          annotations:
            summary: "Slow error-budget burn on {{ $labels.service }}"
            description: "{{ $labels.service }} error ratio is {{ $value | humanizePercentage }} (SLO 99%, threshold 6x burn)."
